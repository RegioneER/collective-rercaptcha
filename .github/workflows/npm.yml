name: Release latest version on npm

on:
  push:
    tags:
      - "*"

jobs:
  release_to_npm:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Disable Corepack's packageManager pin
        run: corepack disable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Determine npm dist-tag from version
        id: npm-tag
        working-directory: frontend/packages/volto-collective-rercaptcha
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            TAG="latest"
          fi
          echo "Version $VERSION -> dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release to npm
        working-directory: frontend/packages/volto-collective-rercaptcha
        run: pnpm publish --provenance --access public --no-git-checks --tag "${{ steps.npm-tag.outputs.tag }}"

      - name: Dump npm debug log on failure
        if: failure()
        run: cat /home/runner/.npm/_logs/*.log
