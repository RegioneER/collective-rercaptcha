name: Release latest version on npm

on:
  push:
    tags:
      - "*"

jobs:
  release_to_npm:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Disable Corepack's packageManager pin
        run: corepack disable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Release to npm
        working-directory: frontend/packages/volto-collective-rercaptcha
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Dump npm debug log on failure
        if: failure()
        run: cat /home/runner/.npm/_logs/*.log
